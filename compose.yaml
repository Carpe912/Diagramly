services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: diagramly
      POSTGRES_USER: diagramly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置数据库密码}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U diagramly]
      interval: 5s
      retries: 10
  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgres://diagramly:${POSTGRES_PASSWORD}@database:5432/diagramly
      DIAGRAMLY_CREDENTIALS: ${DIAGRAMLY_CREDENTIALS:?请设置用户名和密码}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
    ports:
      - 8080:80
    depends_on: [api]
    restart: unless-stopped
volumes:
  database:
