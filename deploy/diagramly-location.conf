# Diagramly 独立站点，不修改其他应用路由。
location = /diagramly { return 301 https://$host/diagramly/; }
location ^~ /diagramly/api/ {
    if ($scheme = http) { return 301 https://$host$request_uri; }
    client_max_body_size 10m;
    proxy_pass http://127.0.0.1:3091/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
}
location ^~ /diagramly/ {
    if ($scheme = http) { return 301 https://$host$request_uri; }
    alias /opt/diagramly/current/dist/;
    index index.html;
    try_files $uri $uri/ /diagramly/index.html;
    add_header Cache-Control "no-cache";
}
